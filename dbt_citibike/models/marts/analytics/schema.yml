version: 2

models:
  # Daily historical ride aggregation
  - name: mart_daily_rides
    description: "Daily Citi Bike ride metrics by rider type and bike type."
    columns:
      - name: ride_date
        tests:
          - not_null

      - name: rider_type
        tests:
          - not_null

      - name: bike_type
        tests:
          - not_null

      - name: total_rides
        tests:
          - not_null


  # Hourly historical ride aggregation
  - name: mart_hourly_rides
    description: "Hourly Citi Bike ride metrics by rider type and bike type."
    columns:
      - name: ride_hour
        tests:
          - not_null

      - name: rider_type
        tests:
          - not_null

      - name: bike_type
        tests:
          - not_null

      - name: total_rides
        tests:
          - not_null


  # Station activity aggregation
  - name: mart_station_performance
    description: "Historical station performance based on departures and arrivals."
    columns:
      - name: station_key
        tests:
          - not_null
          - unique

      - name: total_departures
        tests:
          - not_null

      - name: total_arrivals
        tests:
          - not_null


  # Origin-destination route aggregation
  - name: mart_route_performance
    description: "Historical Citi Bike route performance between origin and destination stations."
    columns:
      - name: start_station_key
        tests:
          - not_null

      - name: end_station_key
        tests:
          - not_null

      - name: total_rides
        tests:
          - not_null


  # Latest realtime station availability
  - name: mart_station_live
    description: "Latest realtime availability status for each Citi Bike station."
    columns:
      - name: station_key
        tests:
          - not_null
          - unique

      - name: snapshot_timestamp
        tests:
          - not_null